[project]
name = "hakai-ctd-qc"
version = "1.0.0"
description = "Hakai Automated Quality Control for CTD profiles"
authors = [{name = "Jessy Barrette", email = "30420025+JessyBarrette@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.1.2",
    "gsw>=3.6.17",
    "ioos-qc>=2.1.0",
    "hakai-api>=1.5.1",
    "tqdm>=4.66.1",
    "PyYAML>=6.0.1",
    "sentry-sdk[loguru]>=2.63",
    "click>=8.1.7",
    "pyarrow>=13.0.0",
    "fastparquet>=2023.10.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "fastapi>=0.112.1",
    "scheduler>=0.8.7",
    "uvicorn>=0.30.6",
    "toml>=0.10.2",
    "apscheduler>=3.10.4",
    "cron-descriptor>=1.4.3",
    "panel>=1.4.5",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "ruff>=0.1.3",
    "black[jupyter]>=24.4.2",
    "isort>=5.13.2",
    "httpx>=0.27.0",
]
review = [
    "sqlalchemy>=2.0.31",
]

[tool.hatch.build.targets.wheel]
packages = ["hakai_ctd_qc"]

[sqlfluff]
dialect = "postgres"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
